# Cloudflare Tunnel: the VM connects out to Cloudflare, which serves the hostname over
# HTTPS. The URL survives VM IP changes, and no inbound web ports need to be open.
# Installed to /etc/cloudflared/config.yml; the tunnel credentials file is copied
# separately and never committed.
tunnel: 7c1f38ba-0629-4806-8f66-9b5f0e3f0757
credentials-file: /etc/cloudflared/food-label-api.json

ingress:
  - hostname: food-label-api.tinkerers.space
    service: http://127.0.0.1:8000
  - service: http_status:404
